# Generated by OpenSpec for GitHub Copilot coding agent support.

name: "Copilot Setup Steps"

# Runs automatically when changed (for validation) and can be triggered manually.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` for Copilot coding agent to pick it up.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install OpenSpec CLI
        # This environment has push rights, so the version is pinned deliberately rather than
        # floating on latest; it gets bumped as part of the dependency-update work. Confirmed
        # clean of preinstall/install/postinstall scripts in its full dependency tree, so
        # --ignore-scripts is safe here.
        run: npm install -g @fission-ai/openspec@1.13.1 --ignore-scripts

      - name: Verify OpenSpec CLI
        run: openspec --version
